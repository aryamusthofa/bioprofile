<!DOCTYPE html>
<html lang="id" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arya Musthofa Roja | Profile & UMKM Showcase</title>

    <!-- Meta SEO & Accessibility -->
    <meta name="description"
        content="Official Link bio and showcase of Arya Musthofa Roja - Software Engineering & App/Web/AI Developer Wonosobo.">
    <meta name="author" content="Arya Musthofa Roja">

    <!-- Custom CSS & Tailwind CSS v4 Browser CDN -->
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Favicon SVG Emoji -->
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
</head>

<body class="min-h-screen transition-colors duration-300 antialiased selection:bg-amber-300 selection:text-slate-900">

    <div class="mx-auto max-w-md px-4 py-10">

        <!-- ==================== TEMA & BAHASA SWITCHER ==================== -->
        <div class="mb-6 flex flex-wrap justify-center items-center gap-2">
            <!-- Theme Switcher -->
            <div id="theme-switcher" class="flex gap-1.5">
                <button type="button" data-theme="terang"
                    class="cursor-pointer rounded-full bg-white/80 backdrop-blur-md px-3 py-1.5 text-xs font-semibold text-slate-800 shadow-sm ring-1 ring-slate-200 transition-all hover:scale-105">Light
                    ☀️</button>
                <button type="button" data-theme="gelap"
                    class="cursor-pointer rounded-full bg-slate-800/80 backdrop-blur-md px-3 py-1.5 text-xs font-semibold text-slate-100 shadow-sm ring-1 ring-slate-700 transition-all hover:scale-105">Dark
                    🌙</button>
                <button type="button" data-theme="hangat"
                    class="cursor-pointer rounded-full bg-amber-200/80 backdrop-blur-md px-3 py-1.5 text-xs font-semibold text-amber-900 shadow-sm ring-1 ring-amber-300 transition-all hover:scale-105">Warm
                    ☕</button>
                <button type="button" data-theme="rgb"
                    class="cursor-pointer rounded-full bg-gradient-to-r from-red-500 via-purple-500 to-blue-500 px-3 py-1.5 text-xs font-bold text-white shadow-sm transition-all hover:scale-105 animate-pulse">RGB
                    🌈</button>
            </div>

            <!-- Language Switcher -->
            <div id="lang-switcher"
                class="flex gap-1 bg-white/80 backdrop-blur-md p-1 rounded-full ring-1 ring-slate-200 shadow-sm">
                <button type="button" data-lang="id"
                    class="lang-btn cursor-pointer rounded-full px-2.5 py-1 text-xs font-bold transition-all">🇮🇩
                    ID</button>
                <button type="button" data-lang="en"
                    class="lang-btn cursor-pointer rounded-full px-2.5 py-1 text-xs font-bold transition-all">🇬🇧
                    EN</button>
            </div>
        </div>

        <!-- ==================== HEADER / PROFIL ==================== -->
        <header class="flex flex-col items-center text-center">
            <div class="relative group">
                <img src="myprofiles.png" alt="Foto Profil Arya Musthofa Roja"
                    class="h-28 w-28 rounded-full object-cover shadow-lg ring-4 ring-white/80 transition-transform duration-300 group-hover:scale-105">
                <span class="absolute bottom-1 right-1 flex h-4 w-4" title="Available for Freelance & UMKM Projects">
                    <span
                        class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-4 w-4 bg-emerald-500 border-2 border-white"></span>
                </span>
            </div>

            <h1 class="mt-4 text-2xl font-bold tracking-tight">Arya Musthofa Roja</h1>
            <p id="header-role" class="mt-1 text-sm font-medium opacity-80"></p>
            <p id="header-location" class="mt-1 text-xs opacity-60 flex items-center gap-1 justify-center"></p>
        </header>

        <!-- ==================== SOCIAL MEDIA BAR ==================== -->
        <nav aria-label="Media Sosial Utama" class="mt-6">
            <ul id="social-list" class="flex justify-center items-center gap-2.5 flex-wrap"></ul>
        </nav>

        <!-- ==================== MAIN CONTENT & SEARCH ==================== -->
        <main class="mt-8 space-y-4">
            <div class="space-y-3">
                <div class="flex items-center justify-between px-1">
                    <h2 class="text-xs font-bold uppercase tracking-wider opacity-60">
                        Link & Showcase UMKM
                    </h2>
                    <span id="link-count"
                        class="text-xs font-bold px-2.5 py-0.5 rounded-full bg-indigo-500/10 text-indigo-600">
                        Loading...
                    </span>
                </div>

                <div class="relative">
                    <input type="text" id="search-input" placeholder="🔍 Cari link, project, atau layanan..."
                        class="w-full rounded-xl border border-slate-200/80 bg-white/90 px-4 py-2.5 text-sm outline-none shadow-sm transition-all focus:border-indigo-500 focus:ring-2 focus:ring-indigo-400/50">
                </div>
            </div>

            <!-- TAB FILTER & LIST LINK -->
            <div id="filter-tabs" class="flex flex-wrap gap-2 pt-1"></div>
            <ul id="link-list" class="space-y-3 pt-2"></ul>

            <!-- NAVIGASI KEMBALI -->
            <div class="pt-4">
                <a href="index.html"
                    class="group inline-flex items-center gap-2 rounded-xl bg-white/90 px-4 py-2.5 text-sm font-semibold text-slate-700 shadow-sm ring-1 ring-slate-200/80 transition-all duration-200 hover:-translate-y-0.5 hover:bg-slate-50 hover:shadow-md hover:ring-amber-300 focus:outline-none focus:ring-2 focus:ring-amber-400">
                    <svg class="h-4 w-4 text-slate-400 transition-transform duration-200 group-hover:-translate-x-1 group-hover:text-amber-500"
                        fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                    </svg>
                    <span>Kembali ke Index</span>
                </a>
            </div>
        </main>

        <!-- FOOTER -->
        <footer class="mt-12 text-center">
            <p class="text-xs font-medium opacity-60">
                &copy; 2026 <span class="font-bold">Arya Musthofa Roja (Armuzz Dev)</span>. Built with Tailwind CSS v4
                &amp; State-Driven Vanilla JS.
            </p>
        </footer>

    </div>

    <!-- Urutan Wajib: languages.js dulu, baru armuzz.js -->
    <script src="languages.js"></script>
    <script src="armuzz.js"></script>
</body>

</html>
